<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-Symbol im Look „Reiseskizze“: Zitrone in Tusche, zart laviert, auf Papier -->
  <defs>
    <filter id="aquarell" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="5" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="26" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.5"/>
    </filter>
    <filter id="tusche" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="5"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#fbfaf5"/>
  <!-- Wasserfarbe, leicht versetzt -->
  <g filter="url(#aquarell)" transform="translate(8 -6)">
    <ellipse cx="262" cy="404" rx="150" ry="18" fill="#55627f" opacity=".16"/>
    <path d="M100 282 C112 270 120 262 126 250 C150 180 205 150 262 150 C330 150 380 195 396 250 C402 258 410 262 416 266 C406 274 402 284 398 296 C380 360 330 392 262 392 C200 392 148 362 128 310 C120 296 112 288 100 282Z" fill="#f3d77e" opacity=".85"/>
    <path d="M300 340 C340 330 380 300 396 262 C392 330 340 384 262 392 C280 380 292 360 300 340Z" fill="#e0a83c" opacity=".55"/>
    <path d="M262 150 C270 110 300 84 352 78 C342 120 312 146 262 150Z" fill="#5b8a4c" opacity=".75"/>
  </g>
  <!-- Tuschelinie -->
  <g filter="url(#tusche)" fill="none" stroke="#1f1c18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 282 C112 270 120 262 126 250 C150 180 205 150 262 150 C330 150 380 195 396 250 C402 258 410 262 416 266 C406 274 402 284 398 296 C380 360 330 392 262 392 C200 392 148 362 128 310 C120 296 112 288 100 282Z" stroke-width="10"/>
    <path d="M262 150 C270 110 300 84 352 78 C342 120 312 146 262 150Z" stroke-width="8"/>
    <path d="M270 138 C292 118 316 102 340 90" stroke-width="5"/>
    <path d="M262 150 C258 132 250 118 240 108" stroke-width="8"/>
    <path d="M168 230 C180 206 204 190 226 184" stroke-width="7"/>
    <path d="M186 300 l4 3 M222 330 l4 3 M300 214 l4 3 M330 300 l4 3 M260 260 l4 3" stroke-width="5"/>
  </g>
</svg>
