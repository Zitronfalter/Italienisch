<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Italienisch</title>
  <meta name="description" content="Italienisch lernen – ruhig, ohne Werbung, offline.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">

  <!-- iPhone: als App vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Italienisch">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- Startseite -->
    <section class="screen" id="screen-start">
      <header class="kopf">
        <p class="gruss" id="gruss">Buongiorno!</p>
        <h1>Italienisch</h1>
      </header>

      <div class="karte">
        <p class="karte-titel">Heute</p>
        <p class="karte-text">Etwa 10 Minuten: erst fällige Vokabeln, dann ein kurzer Text oder ein Grammatik-Thema.</p>
      </div>

      <button class="knopf-los" id="knopf-los" type="button">Los</button>
    </section>

    <!-- Lernrunde (Platzhalter, kommt in einem späteren Schritt) -->
    <section class="screen" id="screen-runde" hidden>
      <header class="kopf">
        <h1>Lernrunde</h1>
      </header>
      <div class="karte">
        <p class="karte-text">Hier kommt bald die Lernrunde hin.</p>
      </div>
      <button class="knopf-zurueck" id="knopf-zurueck" type="button">Zurück</button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
